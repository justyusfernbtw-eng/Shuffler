<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shuffler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@600&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Düzen: solda cam kenar çubuğu, üstte arama, ortada kayan içerik, altta yüzen oynatıcı.
   Tam ekran oynatıcıda kaset solda, sıradaki şarkılar sağda. Renkler çalan şarkının kapağından gelir. */
@property --accent{syntax:'<color>';inherits:true;initial-value:#ff6b78}
@property --c1{syntax:'<color>';inherits:true;initial-value:#3b2c52}
@property --c2{syntax:'<color>';inherits:true;initial-value:#1d3550}
:root{
  --ink:#08080b;
  --text:#f5f5f8;
  --muted:rgba(245,245,248,.62);
  --faint:rgba(245,245,248,.38);
  --hover:rgba(255,255,255,.07);
  --accent:#ff6b78;
  --c1:#3b2c52;
  --c2:#1d3550;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-hand:'Caveat','Bradley Hand','Segoe Print',cursive;
  --ease:cubic-bezier(.22,.9,.24,1);
  --spring:cubic-bezier(.34,1.45,.5,1);
  color-scheme:dark;
  transition:--accent .9s ease,--c1 1.2s ease,--c2 1.2s ease;
}
*{box-sizing:border-box}
html{box-sizing:border-box;height:100%}
body{height:100%;margin:0;background:var(--ink);color:var(--text);font:400 15px/1.45 var(--f-body);overflow-x:hidden;overflow-y:auto;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
svg{display:block}
h1,h2,h3,p{margin:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.none{color:var(--muted);padding:28px 8px}

/* Arka plan ışıması */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;width:78vmax;height:78vmax;border-radius:50%;will-change:transform;opacity:.75}
.ambient i:nth-child(1){left:-28vmax;top:-34vmax;background:radial-gradient(circle,var(--c1),transparent 66%);animation:drift1 40s ease-in-out infinite alternate}
.ambient i:nth-child(2){right:-32vmax;bottom:-38vmax;background:radial-gradient(circle,var(--c2),transparent 66%);animation:drift2 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(14vmax,10vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-12vmax,-8vmax) scale(1.08)}}

/* Cam yüzey */
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04) 55%,rgba(255,255,255,.075));-webkit-backdrop-filter:blur(28px) saturate(175%) brightness(1.06);backdrop-filter:blur(28px) saturate(175%) brightness(1.06);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.05),0 22px 54px -22px rgba(0,0,0,.7)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.06) 30%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.3));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .45s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.17),transparent 62%)}
.glass:hover::after{opacity:1}

/* Yerleşim */
.app{position:relative;z-index:1;height:100%;min-height:560px;display:grid;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"side top" "side main" "bar bar"}
.app:not(.has-bar){grid-template-rows:auto minmax(0,1fr);grid-template-areas:"side top" "side main"}
.side{grid-area:side;display:flex;flex-direction:column;gap:18px;padding:18px 12px 14px;min-height:0}
.top{grid-area:top;display:flex;align-items:center;gap:10px;min-width:0}
.view{grid-area:main;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:2px 6px 28px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent;outline:none}
.tabs{grid-area:tabs;display:none}

.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font:700 22px var(--f-display);letter-spacing:-.035em}
.brand .logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px -8px var(--accent);color:#0b0b0f}
.brand .logo .ic{width:17px;height:17px;stroke-width:2.2}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:15px;color:var(--muted);font-weight:500;transition:background .25s,color .25s}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button[aria-current=page]{background:rgba(255,255,255,.12);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.side h4{margin:0;padding:0 12px;font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.mini{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.mini button{padding:8px 12px;border-radius:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .25s,color .25s}
.mini button:hover{background:var(--hover);color:var(--text)}
.side .foot{display:flex;flex-direction:column;gap:6px}

.search{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;padding:0 16px;height:46px;border-radius:999px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.search input::placeholder{color:var(--faint)}
.search .ic{color:var(--muted)}
.brand-m{display:none}

/* Düğmeler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border-radius:999px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .45s var(--spring),background .3s,box-shadow .3s}
.btn:hover{background:rgba(255,255,255,.17);transform:translateY(-1px)}
.btn:active{transform:scale(.95)}
.btn.main{background:var(--text);color:#0b0b0f;box-shadow:0 12px 32px -12px rgba(255,255,255,.55)}
.btn.main:hover{background:#fff}
.btn.big{padding:17px 32px;font-size:16px}
.btn.ico{width:46px;height:46px;padding:0}
.btn.arm,.rm.arm,.selbar .arm{background:rgba(255,84,96,.42)!important;color:#fff}
.btn:disabled{opacity:.4;pointer-events:none}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .25s,color .25s,transform .4s var(--spring)}
.ib:hover{background:rgba(255,255,255,.1);color:var(--text)}
.ib:active{transform:scale(.88)}
.ib[aria-pressed=true]{color:var(--accent)}
.ib.play{width:52px;height:52px;background:var(--text);color:#0b0b0f}
.ib.play:hover{background:#fff;transform:scale(1.06)}
.ib.play .ic{width:24px;height:24px}

/* Sayfa girişi */
.page{animation:pageIn .7s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(26px) scale(.985);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.in{animation:rowIn .75s var(--ease) both;animation-delay:calc(var(--i,0)*42ms + 140ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* Ana sayfa */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 40px;align-items:end;padding:clamp(22px,4vw,46px);border-radius:34px;margin-top:6px}
.hero h1{margin:8px 0 12px;font:700 clamp(48px,8vw,96px)/.9 var(--f-display);letter-spacing:-.05em}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted)}
.hero-ctl{display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-width:0}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:999px;width:min(100%,400px);background:rgba(255,255,255,.06);box-shadow:inset 0 1px 3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 20px -8px rgba(0,0,0,.7);transform:translateX(calc(var(--k,0)*100%));transition:transform .6s var(--spring)}
.seg button{position:relative;z-index:1;padding:10px 6px;border-radius:999px;text-align:center;font-weight:600;font-size:14px;color:var(--muted);transition:color .3s}
.seg button[aria-checked=true]{color:var(--text)}
.seg-d{min-height:42px;max-width:400px;color:var(--muted);font-size:14px}
.sec-h{display:flex;align-items:baseline;gap:14px;margin:34px 4px 14px}
.h2{font:650 clamp(26px,3.4vw,34px)/1.05 var(--f-display);letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px 18px}
.card{display:flex;flex-direction:column;gap:10px;padding:10px 10px 14px;border-radius:22px;min-width:0;transition:background .3s,transform .5s var(--spring)}
.card:hover{background:var(--hover);transform:translateY(-3px)}
.card b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span.m{color:var(--muted);font-size:13.5px}

.mosaic{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;box-shadow:0 26px 50px -24px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.14)}
.mosaic.one{grid-template-columns:1fr;grid-template-rows:1fr}
.cv{display:block;position:relative;overflow:hidden;background:#222;width:100%;height:100%}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv.gen{background:linear-gradient(140deg,hsl(var(--h) 58% 46%),hsl(calc(var(--h) + 42) 55% 26%));display:grid;place-items:center;color:rgba(255,255,255,.72)}
.cv.gen svg{width:42%;height:42%;fill:none;stroke:currentColor;stroke-width:1.6}

/* Boş durum */
.empty{display:grid;place-items:center;min-height:100%;padding:12px 0}
.dz{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;width:min(680px,100%);padding:clamp(30px,6vw,64px) clamp(20px,5vw,56px);border-radius:36px}
.dz .ring{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.1);animation:bob 4.5s ease-in-out infinite alternate}
.dz .ring .ic{width:34px;height:34px;stroke-width:1.5}
@keyframes bob{to{transform:translateY(-8px)}}
.dz h1{font:700 clamp(34px,6vw,58px)/.95 var(--f-display);letter-spacing:-.045em;text-wrap:balance}
.dz p{color:var(--muted);max-width:46ch;text-wrap:pretty}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}

/* Listeler */
.ph{display:flex;align-items:center;gap:16px;margin:10px 4px 14px;flex-wrap:wrap}
.ph .spacer{flex:1}
.thead,.row{display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,1fr) 64px 38px;align-items:center;gap:12px;padding:0 10px}
.pl .thead,.pl .row{grid-template-columns:44px minmax(0,1.6fr) minmax(0,1fr) 64px}
.thead{height:34px;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.thead span:first-child{text-align:center}
.thead span:nth-child(4){text-align:right}
.row{height:64px;border-radius:16px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 64px;transition:background .25s}
.row:hover{background:var(--hover)}
.row.on{background:rgba(255,255,255,.1)}
.row.sl{background:rgba(255,255,255,.12)}
.row .ix{position:relative;display:grid;place-items:center;height:100%;font:500 13px var(--f-mono);color:var(--faint)}
.row .ix>*{grid-area:1/1}
.row .pi,.row .ck,.row .eq{opacity:0;transition:opacity .2s}
.row .pi{width:18px;height:18px;fill:currentColor;stroke:none;color:var(--text)}
.row:hover .pi{opacity:1}
.row:hover .n{opacity:0}
.ck{width:22px;height:22px;border-radius:50%;border:1.6px solid rgba(255,255,255,.4);display:grid;place-items:center;color:transparent;transition:background .25s,border-color .25s,opacity .2s}
.ck .ic{width:13px;height:13px;stroke-width:3}
.row:hover .ck,.row.sl .ck{opacity:1}
.row.sl .ck{background:var(--accent);border-color:var(--accent);color:#0b0b0f}
.row.sl .n{opacity:0}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;justify-content:center}
.eq i{width:3px;height:100%;background:var(--accent);border-radius:2px;transform-origin:bottom;transform:scaleY(.3);animation:eq 900ms ease-in-out infinite alternate;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.3s;animation-duration:760ms}
.eq i:nth-child(3){animation-delay:-.6s;animation-duration:1040ms}
@keyframes eq{to{transform:scaleY(1)}}
.row.on .eq{opacity:1}
.row.on .n,.row.on:hover .pi{opacity:0}
.is-playing .row.on .eq i,.is-playing .qrow.cur .eq i{animation-play-state:running}
.row .tt{display:flex;align-items:center;gap:12px;min-width:0}
.row .cv{width:44px;height:44px;border-radius:10px;flex:none}
.txt{min-width:0;display:flex;flex-direction:column}
.txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt span,.row .al{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .txt b{color:var(--accent)}
.tm{font:400 13px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.rm{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .2s,background .2s}
.row:hover .rm,.rm.arm{opacity:1}
.rm:hover{background:rgba(255,255,255,.12);color:var(--text)}
.rm .ic{width:17px;height:17px}

/* Çalma listesi başlığı */
.plh{display:flex;align-items:flex-end;gap:clamp(18px,3vw,32px);padding:14px 4px 22px;flex-wrap:wrap}
.plh .mosaic{width:clamp(150px,22vw,230px);flex:none;border-radius:24px}
.plx{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 320px}
.plname{font:700 clamp(34px,5.4vw,66px)/.96 var(--f-display);letter-spacing:-.045em;outline:none;border-radius:10px;overflow-wrap:anywhere;text-wrap:balance}
.plname[contenteditable=true]{background:rgba(255,255,255,.08);box-shadow:0 0 0 2px var(--accent);padding:0 8px;margin:0 -8px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.sp.spin{animation:spinOnce .9s var(--ease)}
@keyframes spinOnce{to{transform:rotate(360deg)}}

/* Alt oynatıcı */
.bar{grid-area:bar;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:10px 16px 10px 12px;border-radius:26px;animation:barIn .8s var(--spring) both}
@keyframes barIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.bar>.rng{position:absolute;left:26px;right:26px;top:-8px;width:auto;z-index:2}
.bt{display:flex;align-items:center;gap:14px;min-width:0;border-radius:16px;padding:2px}
.bt .cv{width:50px;height:50px;border-radius:12px;flex:none;box-shadow:0 8px 20px -8px rgba(0,0,0,.8)}
.bt .txt b{font-size:15px}
.ctl{display:flex;align-items:center;gap:6px}
.tcur{font:400 12.5px var(--f-mono);color:var(--muted);margin-left:10px;min-width:92px;font-variant-numeric:tabular-nums}
.ex{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.vol{display:flex;align-items:center;gap:8px;color:var(--muted);width:130px}
.vol .rng{width:100%}

/* Aralık çubukları */
.rng{-webkit-appearance:none;appearance:none;height:18px;margin:0;border-radius:9px;cursor:pointer;background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.22) var(--p,0%)) center/100% 4px no-repeat;transition:background-size .2s}
.rng:hover{background-size:100% 6px}
.rng::-webkit-slider-runnable-track{background:transparent;height:18px}
.rng::-moz-range-track{background:transparent;height:18px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:2px;box-shadow:0 2px 8px rgba(0,0,0,.5);transform:scale(0);transition:transform .25s var(--spring)}
.rng::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);transform:scale(0);transition:transform .25s var(--spring)}
.rng:hover::-webkit-slider-thumb,.rng:focus-visible::-webkit-slider-thumb,.rng:active::-webkit-slider-thumb{transform:scale(1)}
.rng:hover::-moz-range-thumb,.rng:focus-visible::-moz-range-thumb,.rng:active::-moz-range-thumb{transform:scale(1)}

/* Tam ekran oynatıcı */
.np{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-right,0px));background:rgba(8,8,11,.38);-webkit-backdrop-filter:blur(48px) saturate(185%);backdrop-filter:blur(48px) saturate(185%);opacity:0;visibility:hidden;transform:translateY(7%) scale(.97);transition:opacity .5s var(--ease),transform .7s var(--ease),visibility 0s .7s}
.np.open{opacity:1;visibility:visible;transform:none;transition:opacity .5s var(--ease),transform .7s var(--ease),visibility 0s}
.np-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));width:46px;height:46px;border-radius:50%;display:grid;place-items:center;z-index:2}
.np-in{width:min(1180px,100%);height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:clamp(20px,4vw,48px);align-items:center;min-height:0;padding-top:34px}
.np-main{display:flex;flex-direction:column;gap:20px;min-width:0;align-items:stretch}
.stage{perspective:1200px;width:min(100%,520px);margin:0 auto}
.float{animation:float 7s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-8px) rotate(-.5deg)}}
.cassette{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 40px 46px rgba(0,0,0,.55));transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease)}
.cassette.swap{animation:insert .95s var(--spring)}
@keyframes insert{from{opacity:0;transform:translateX(-46px) translateY(18px) rotate(-5deg) scale(.94)}to{opacity:1}}
.cs-body{stroke:rgba(255,255,255,.3);stroke-width:1.2}
.cs-label{fill:#ecebe6}
.cs-stripe{fill:var(--accent)}
.cs-brand{font:500 10.5px var(--f-mono);letter-spacing:.3em;fill:rgba(10,10,14,.78)}
.cs-hand{font-family:var(--f-hand);font-weight:600;fill:#1a1a21}
.cs-rule{stroke:rgba(20,20,30,.2);stroke-width:1}
.cs-win{fill:#0b0b0e;stroke:rgba(255,255,255,.2)}
.cs-tape{fill:#2e221c}
.cs-tapeline{stroke:#2e221c;stroke-width:2.6;fill:none}
.cs-hub{fill:#eceaf0}
.cs-tooth{fill:#0b0b0e}
.cs-low{fill:#0e0e12;stroke:rgba(255,255,255,.14)}
.cs-screw{fill:rgba(255,255,255,.18)}
.hub{transform-box:fill-box;transform-origin:center;animation:spin 2.6s linear infinite;animation-play-state:paused}
.is-playing .hub{animation-play-state:running}
@keyframes spin{to{transform:rotate(-360deg)}}
.np-meta{display:flex;align-items:center;gap:14px;min-width:0}
.np-meta .cv{width:58px;height:58px;border-radius:14px;flex:none;box-shadow:0 10px 24px -10px rgba(0,0,0,.8)}
.np-meta h2{font:650 clamp(22px,3vw,30px)/1.05 var(--f-display);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta p{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-seek{display:flex;align-items:center;gap:12px;font:400 12.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.np-seek .rng{flex:1}
.np-ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.queue{display:flex;flex-direction:column;min-height:0;max-height:min(640px,100%);padding:16px 8px 8px}
.queue header{display:flex;align-items:baseline;justify-content:space-between;padding:0 12px 10px}
.queue h3{font:650 20px var(--f-display);letter-spacing:-.02em}
.queue header span{font:500 12px var(--f-mono);color:var(--muted)}
.qlist{overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;min-height:0}
.qrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;width:100%;transition:background .25s}
.qrow:hover{background:var(--hover)}
.qrow .cv{width:42px;height:42px;border-radius:9px;flex:none}
.qrow .txt{flex:1}
.qrow .tm{flex:none}

/* Üst katmanlar */
.selbar,.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 20px;border-radius:999px;max-width:calc(100vw - 32px)}
body.has-bar .selbar,body.has-bar .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
.selbar{animation:pop .5s var(--spring) both}
.selbar .btn{padding:9px 16px;font-size:14px}
.selbar b{font-weight:600;white-space:nowrap}
.toast{padding:12px 20px;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(16px) scale(.96);transition:opacity .35s,transform .5s var(--spring);flex-direction:column;align-items:stretch;gap:8px;min-width:200px}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast .tbar{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
.toast .tbar i{display:block;height:100%;width:var(--w,0%);background:var(--accent);transition:width .3s}
.toast .tbar[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(24px) scale(.94)}to{opacity:1;transform:translateX(-50%)}}
.dropov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(8,8,11,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .3s}
.dropov.on{opacity:1}
.dropov .glass{padding:46px 62px;border-radius:36px;font:650 clamp(22px,4vw,34px) var(--f-display);letter-spacing:-.03em;text-align:center;outline:2px dashed rgba(255,255,255,.4);outline-offset:-14px}

/* ShufflerShare */
.shov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(8,8,11,.5);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s}
.shov.open{opacity:1;visibility:visible;transition:opacity .35s var(--ease),visibility 0s}
.shov-panel{position:relative;width:min(420px,100%);border-radius:28px;padding:36px 28px 28px;text-align:center;transform:translateY(14px) scale(.97);transition:transform .45s var(--spring)}
.shov.open .shov-panel{transform:none}
.shov-close{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.shov-close:hover{background:rgba(255,255,255,.1);color:var(--text)}
.shov h3{font:650 22px var(--f-display);letter-spacing:-.02em;margin-bottom:6px}
.shov p.d{color:var(--muted);font-size:14px;line-height:1.5;max-width:320px;margin:0 auto}
.shov .code{font:600 28px var(--f-mono);letter-spacing:.28em;padding:12px 10px;border-radius:16px;background:rgba(255,255,255,.07);margin:16px auto;max-width:280px;user-select:all}
.qrwrap{width:184px;height:184px;margin:6px auto 2px;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;animation:qrIn .6s var(--spring) both}
@keyframes qrIn{from{opacity:0;transform:scale(.85) rotate(-3deg)}to{opacity:1;transform:none}}
.qrwrap svg{width:88%;height:88%;display:block}
.codein{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.codein input{width:100%;max-width:240px;text-align:center;font:600 22px var(--f-mono);letter-spacing:.25em;text-transform:lowercase;background:rgba(255,255,255,.08);border:1.6px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 10px;color:var(--text)}
.codein input:focus{outline:none;border-color:var(--accent)}
.shov .dots{display:flex;gap:6px;justify-content:center;margin:16px 0 4px}
.shov .dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dotp 1.1s ease-in-out infinite}
.shov .dots i:nth-child(2){animation-delay:.15s}.shov .dots i:nth-child(3){animation-delay:.3s}
@keyframes dotp{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.mrg{display:flex;align-items:center;justify-content:center;height:76px;margin:12px 0 4px}
.mrg .cs{width:72px;height:46px;border-radius:9px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 24%,#2b2b33),color-mix(in srgb,var(--accent) 8%,#17171c));border:1px solid rgba(255,255,255,.18);position:relative;box-shadow:0 10px 22px -10px rgba(0,0,0,.6)}
.mrg .cs::before{content:'';position:absolute;inset:10px 10px auto;height:16px;border-radius:5px;background:rgba(0,0,0,.35)}
.mrg .cs.l{animation:mrgL 1s var(--spring) both}
.mrg .cs.r{animation:mrgR 1s var(--spring) both;margin-left:-6px}
.mrg.hit .cs{box-shadow:0 10px 26px -8px var(--accent)}
@keyframes mrgL{from{transform:translateX(-130px) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
@keyframes mrgR{from{transform:translateX(130px) rotate(10deg);opacity:0}to{transform:none;opacity:1}}
.shov .prog{height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin:18px 0 8px}
.shov .prog i{display:block;height:100%;width:var(--w,0%);background:var(--accent);transition:width .35s var(--ease)}
.shov .ok{width:58px;height:58px;border-radius:50%;background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent);display:grid;place-items:center;margin:4px auto 14px;animation:pop .5s var(--spring) both}
.shov .btn{margin-top:14px}

/* Dar ekran */
@media (max-width:1060px){.row .al,.thead .al{display:none}.thead,.row{grid-template-columns:44px minmax(0,1fr) 64px 38px}.pl .thead,.pl .row{grid-template-columns:44px minmax(0,1fr) 64px}.vol{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "main" "bar" "tabs";gap:10px}
  .app:not(.has-bar){grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "tabs"}
  .side{display:none}
  .brand-m{display:flex;padding:0}
  .brand-m span.w{display:none}
  .tabs{display:flex;justify-content:space-around;padding:6px;border-radius:26px}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:20px;font-size:11.5px;font-weight:600;color:var(--muted);transition:background .25s,color .25s}
  .tabs button[aria-current=page]{background:rgba(255,255,255,.13);color:var(--text)}
  .hero{grid-template-columns:1fr}
  .search{max-width:none}
  .btn.add span{display:none}
  .btn.add{width:46px;padding:0}
  .bar{grid-template-columns:minmax(0,1fr) auto;padding:8px 12px 8px 10px;gap:8px}
  .bar .ex,.bar .tcur,.bar .ctl .ib:first-child{display:none}
  .bar>.rng{left:22px;right:22px}
  body.has-bar .selbar,body.has-bar .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}
  .selbar,.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
  .np-in{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;align-content:start;overflow-y:auto;padding-top:60px;align-items:start;scrollbar-width:none}
  .queue{max-height:none}
  .qlist{overflow:visible}
}
@media (hover:none){.row .ck{opacity:1}.row .n{display:none}.pl .row .n{display:block}.rm{opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

  mode: 'balanced', queue: [], qi: -1, playing: false, repeat: 'off', srcList: null,
};
try {
  const m = localStorage.getItem('shuffler.mode'); if (MODES.some(x => x.id === m)) S.mode = m;
  const r = localStorage.getItem('shuffler.repeat'); if (['off', 'all', 'one'].includes(r)) S.repeat = r;
} catch (e) {}
const covers = new Map(), coverUrls = new Map(), fileMem = new Map(), palCache = new Map();
const aud = $('#aud');

/* ---------- depolama (IndexedDB) ---------- */
const DB = (() => {
  let db = null;
  const open = () => new Promise((ok, no) => {
    let r; try { r = indexedDB.open('shuffler', 1); } catch (e) { return no(e); }
    r.onupgradeneeded = () => { for (const n of ['tracks', 'lists', 'files', 'covers']) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, { keyPath: 'id' }); };
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); r.onblocked = () => no(new Error('blocked'));
  });
  const run = (store, mode, fn) => new Promise((ok, no) => {
    if (!db) return ok(undefined);
    try { const t = db.transaction(store, mode); const req = fn(t.objectStore(store)); t.oncomplete = () => ok(req && req.result); t.onerror = t.onabort = () => no(t.error); } catch (e) { no(e); }
  });
  return {
    async init() { try { db = await open(); } catch (e) { db = null; } return !!db; },
    put: (s, o) => run(s, 'readwrite', x => x.put(o)),
    del: (s, id) => run(s, 'readwrite', x => x.delete(id)),
    get: (s, id) => run(s, 'readonly', x => x.get(id)),
    all: async s => (await run(s, 'readonly', x => x.getAll())) || [],
  };
})();
let warned = false;
const keep = p => p.catch(() => { if (!warned) { warned = true; toast('Depolama dolu. Bazı şarkılar bu oturumdan sonra kalmayabilir.'); } });
const saveTrack = t => keep(DB.put('tracks', t));
const saveList = l => keep(DB.put('lists', l));

/* ---------- etiket okuma ---------- */
const ascii = (b, s, n) => { let o = ''; for (let i = s; i < s + n && i < b.length; i++) o += String.fromCharCode(b[i]); return o; };
const sniff = u => (u[0] === 0x89 && u[1] === 0x50 ? 'image/png' : u[0] === 0xff && u[1] === 0xd8 ? 'image/jpeg' : u[0] === 0x52 && u[1] === 0x49 ? 'image/webp' : 'image/jpeg');
const syncsafe = (b, p) => ((b[p] & 127) << 21) | ((b[p + 1] & 127) << 14) | ((b[p + 2] & 127) << 7) | (b[p + 3] & 127);
const dec = (label, u8) => { try { return new TextDecoder(label).decode(u8); } catch (e) { return ''; } };
function id3Text(body) {
  const e = body[0], d = body.subarray(1);
  let s;
  if (e === 1 || e === 2) s = dec(e === 2 || (d[0] === 0xfe && d[1] === 0xff) ? 'utf-16be' : 'utf-16le', d);
  else if (e === 3) s = dec('utf-8', d);
  else s = dec('windows-1254', d);
  return s.replace(/﻿/g, '').split('\u0000')[0].trim();
}
function id3Pic(body) {
  const e = body[0]; let p = 1;
  while (p < body.length && body[p] !== 0) p++;
  const mime = ascii(body, 1, p - 1); p += 2;
  if (e === 1 || e === 2) { while (p + 1 < body.length && !(body[p] === 0 && body[p + 1] === 0)) p += 2; p += 2; }
  else { while (p < body.length && body[p] !== 0) p++; p += 1; }
  const data = body.slice(p);
  if (data.length < 64) return null;
  return new Blob([data], { type: /^image\//.test(mime) ? mime : sniff(data) });
}
async function readId3(file, out) {
  const h = new Uint8Array(await file.slice(0, 10).arrayBuffer());
  const ver = h[3];
  if (ver < 3) return;
  const size = syncsafe(h, 6);
  const buf = new Uint8Array(await file.slice(10, 10 + Math.min(size, 12e6)).arrayBuffer());
  const dv = new DataView(buf.buffer);
  let p = 0;
  if (h[5] & 0x40) p = ver === 4 ? syncsafe(buf, 0) : dv.getUint32(0) + 4;
  while (p + 10 <= buf.length) {
    const id = ascii(buf, p, 4);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const fs = ver === 4 ? syncsafe(buf, p + 4) : dv.getUint32(p + 4);
    const body = buf.subarray(p + 10, p + 10 + fs); p += 10 + fs;
    if (!body.length) continue;
    if (id === 'TIT2') out.title = id3Text(body);
    else if (id === 'TPE1') out.artist = id3Text(body);
    else if (id === 'TALB') out.album = id3Text(body);
    else if (id === 'APIC' && !out.cover) out.cover = id3Pic(body);
  }
}
async function readFlac(file, out) {
  let pos = 4;
  for (let guard = 0; guard < 64; guard++) {
    const h = new Uint8Array(await file.slice(pos, pos + 4).arrayBuffer());
    if (h.length < 4) break;
    const last = h[0] & 128, type = h[0] & 127, len = (h[1] << 16) | (h[2] << 8) | h[3];
    pos += 4;
    if (type === 4 && len < 4e6) {
      const b = new Uint8Array(await file.slice(pos, pos + len).arrayBuffer()); const dv = new DataView(b.buffer);
      let p = 4 + dv.getUint32(0, true); const n = dv.getUint32(p, true); p += 4;
      for (let i = 0; i < n && p + 4 <= b.length; i++) {
        const l = dv.getUint32(p, true); p += 4;
        const kv = dec('utf-8', b.subarray(p, p + l)); p += l;
        const k = kv.indexOf('='); if (k < 0) continue;
        const key = kv.slice(0, k).toUpperCase(), val = kv.slice(k + 1).trim();
        if (key === 'TITLE') out.title = val; else if (key === 'ARTIST') out.artist = val; else if (key === 'ALBUM') out.album = val;
      }
    } else if (type === 6 && !out.cover && len < 12e6) {
      const b = new Uint8Array(await file.slice(pos, pos + len).arrayBuffer()); const dv = new DataView(b.buffer);
      let p = 4; const ml = dv.getUint32(p); p += 4 + ml; const dl = dv.getUint32(p); p += 4 + dl + 16;
      const dlen = dv.getUint32(p); p += 4;
      const data = b.slice(p, p + dlen);
      if (data.length > 64) out.cover = new Blob([data], { type: sniff(data) });
    }
    pos += len;
    if (last || pos >= file.size) break;
  }
}
async function readMp4(file, out) {
  if (file.size > 80e6) return;
  const buf = new Uint8Array(await file.arrayBuffer()); const dv = new DataView(buf.buffer);
  const atoms = (s, e) => {
    const r = []; let p = s;
    while (p + 8 <= e) {
      let sz = dv.getUint32(p), hl = 8; const t = ascii(buf, p + 4, 4);
      if (sz === 1) { sz = Number(dv.getBigUint64(p + 8)); hl = 16; } else if (sz === 0) sz = e - p;
      if (sz < hl) break;
      r.push({ t, s: p + hl, e: Math.min(e, p + sz) }); p += sz;
    }
    return r;
  };
  const find = (list, t) => list.find(a => a.t === t);
  const moov = find(atoms(0, buf.length), 'moov'); if (!moov) return;
  const udta = find(atoms(moov.s, moov.e), 'udta'); if (!udta) return;
  const meta = find(atoms(udta.s, udta.e), 'meta'); if (!meta) return;
  const ilst = find(atoms(meta.s + 4, meta.e), 'ilst'); if (!ilst) return;
  for (const it of atoms(ilst.s, ilst.e)) {
    const d = find(atoms(it.s, it.e), 'data'); if (!d) continue;
    const payload = buf.subarray(d.s + 8, d.e);
    if (it.t === '©nam') out.title = dec('utf-8', payload).trim();
    else if (it.t === '©ART') out.artist = dec('utf-8', payload).trim();
    else if (it.t === '©alb') out.album = dec('utf-8', payload).trim();
    else if (it.t === 'covr' && payload.length > 64) out.cover = new Blob([payload.slice()], { type: sniff(payload) });
  }
}
function fromName(n) {
  n = n.replace(/\.[^.]+$/, '').replace(/_/g, ' ').replace(/^\s*\d{1,3}\s*[.\-)]\s*/, '').trim();
  const m = n.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  return m ? { artist: m[1].trim(), title: m[2].trim() } : { artist: '', title: n };
}
async function readTags(file) {
  const out = { title: '', artist: '', album: '', cover: null };
  try {
    const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    if (head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) await readId3(file, out);
    else if (ascii(head, 0, 4) === 'fLaC') await readFlac(file, out);
    else if (ascii(head, 4, 4) === 'ftyp') await readMp4(file, out);
  } catch (e) {}
  const nm = fromName(file.name);
  if (!out.title) { out.title = nm.title; if (!out.artist) out.artist = nm.artist; }
  return out;
}
function probeDuration(file) {
  return new Promise(res => {
    const a = new Audio(); a.preload = 'metadata';
    let u; try { u = URL.createObjectURL(file); } catch (e) { return res(0); }
    let t;
    const done = v => { clearTimeout(t); a.onloadedmetadata = a.onerror = null; a.removeAttribute('src'); URL.revokeObjectURL(u); res(v); };
    t = setTimeout(() => done(0), 4000);
    a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : 0);
    a.onerror = () => done(0);
    a.src = u;
  });
}

/* ---------- kapak ve renk ---------- */
const coverUrl = t => {
  const b = covers.get(t.id); if (!b) return null;
  let u = coverUrls.get(t.id);
  if (!u) { u = URL.createObjectURL(b); coverUrls.set(t.id, u); }
  return u;
};
const thumb = (t, cls = '') => {
  const u = coverUrl(t);
  return u ? `<span class="cv ${cls}"><img src="${u}" alt="" loading="lazy" decoding="async"></span>`
    : `<span class="cv gen ${cls}" style="--h:${hue(t.album ? t.artist + t.album : t.title + t.artist)}"><svg viewBox="0 0 24 24"><use href="#i-note"/></svg></span>`;
};
function palette(t) {
  if (palCache.has(t.id)) return Promise.resolve(palCache.get(t.id));
  const fallback = () => ({ h: hue(t.album ? t.artist + t.album : t.title + t.artist), s: 62 });
  const u = coverUrl(t);
  if (!u) { const p = fallback(); palCache.set(t.id, p); return Promise.resolve(p); }
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      let p;
      try {
        const c = document.createElement('canvas'); c.width = c.height = 24;
        const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(im, 0, 0, 24, 24);
        const d = g.getImageData(0, 0, 24, 24).data;
        let R = 0, G = 0, B = 0, W = 0;
        for (let i = 0; i < d.length; i += 4) {
          const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
          const sat = (mx - mn) / (mx || 1);
          const w = 0.12 + sat * sat * 3 * (mx > 40 ? 1 : 0.2);
          R += d[i] * w; G += d[i + 1] * w; B += d[i + 2] * w; W += w;
        }
        const r = R / W / 255, g2 = G / W / 255, b = B / W / 255;
        const mx = Math.max(r, g2, b), mn = Math.min(r, g2, b), dl = mx - mn;
        let h = 0;
        if (dl) h = mx === r ? ((g2 - b) / dl) % 6 : mx === g2 ? (b - r) / dl + 2 : (r - g2) / dl + 4;
        h = Math.round(((h * 60) + 360) % 360);
        const l = (mx + mn) / 2, s = dl ? dl / (1 - Math.abs(2 * l - 1)) : 0;
        p = { h, s: s * 100 };
      } catch (e) { p = fallback(); }
      palCache.set(t.id, p); res(p);
    };
    im.onerror = () => res(fallback());
    im.src = u;
  });
}
function applyPalette(p) {
  const st = document.documentElement.style, s = Math.max(32, Math.min(86, p.s));
  st.setProperty('--accent', `hsl(${p.h} ${s}% 68%)`);
  st.setProperty('--c1', `hsl(${p.h} ${Math.min(70, s)}% 30%)`);
  st.setProperty('--c2', `hsl(${(p.h + 38) % 360} ${Math.min(60, s)}% 22%)`);
}

/* ---------- bildirim ---------- */
let toastT;
function toast(msg, o = {}) {
  const el = $('#toast');
  $('.tmsg', el).textContent = msg;
  const bar = $('.tbar', el);
  bar.hidden = o.progress == null;
  if (o.progress != null) bar.firstElementChild.style.setProperty('--w', Math.round(o.progress * 100) + '%');
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('on'));
  clearTimeout(toastT);
  if (!o.sticky) toastT = setTimeout(() => el.classList.remove('on'), 3400);
}

/* ---------- şarkı ekleme ---------- */
const AUDIO_RE = /\.(mp3|m4a|aac|flac|ogg|oga|opus|wav|weba)$/i;
const sigOf = f => `${f.name}|${f.size}|${f.lastModified}`;
let importing = false;
async function addFiles(input) {
  const files = [...input].filter(f => /^audio\//.test(f.type) || AUDIO_RE.test(f.name));
  if (!files.length) { toast('Ses dosyası bulunamadı.'); return; }
  if (importing) { toast('Önceki ekleme bitsin, sonra yenisini ekle.'); return; }
  const known = new Set([...S.tracks.values()].map(t => t.sig));
  const todo = files.filter(f => !known.has(sigOf(f)));
  if (!todo.length) { toast('Bu şarkılar zaten kütüphanende.'); return; }
  importing = true;
  let done = 0, added = 0, idx = 0;
  const total = todo.length;
  toast(`Okunuyor 0/${total}`, { sticky: true, progress: 0 });
  const worker = async () => {
    while (idx < total) {
      const f = todo[idx++];
      try {
        const [tags, duration] = await Promise.all([readTags(f), probeDuration(f)]);
        const t = { id: uid(), sig: sigOf(f), title: tags.title || f.name, artist: tags.artist || '', album: tags.album || '', duration, size: f.size, added: Date.now(), plays: 0, last: 0 };
        S.tracks.set(t.id, t); fileMem.set(t.id, f);
        if (tags.cover) { covers.set(t.id, tags.cover); keep(DB.put('covers', { id: t.id, blob: tags.cover })); }
        keep(DB.put('files', { id: t.id, blob: f })); saveTrack(t);
        added++;
      } catch (e) {}
      done++;
      toast(`Okunuyor ${done}/${total}`, { sticky: true, progress: done / total });
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  importing = false;
  toast(added ? `${added} şarkı eklendi` : 'Şarkılar okunamadı.');
  if (['home', 'library'].includes(S.route.name)) render(); else renderSide();
}
function walkEntry(entry, out) {
  return new Promise(res => {
    if (entry.isFile) { entry.file(f => { out.push(f); res(); }, () => res()); return; }
    if (!entry.isDirectory) return res();
    const rd = entry.createReader(), all = [];
    const pull = () => rd.readEntries(async es => {
      if (!es.length) { for (const e of all) await walkEntry(e, out); return res(); }
      all.push(...es); pull();
    }, () => res());
    pull();
  });
}

/* ---------- görünümler ---------- */
const cmp = (a, b) => (a.artist || '~').localeCompare(b.artist || '~', 'tr') || (a.album || '').localeCompare(b.album || '', 'tr') || a.title.localeCompare(b.title, 'tr');
function libraryList() {
  const q = S.query.trim().toLocaleLowerCase('tr');
  let a = [...S.tracks.values()];
  if (q) a = a.filter(t => (t.title + ' ' + t.artist + ' ' + t.album).toLocaleLowerCase('tr').includes(q));
  return a.sort(cmp);
}
function mosaic(items, cls = '') {
  const seen = new Set(), pick = [];
  for (const t of items) { const k = t.album ? t.artist + t.album : t.id; if (!seen.has(k)) { seen.add(k); pick.push(t); } if (pick.length === 4) break; }
  if (pick.length < 4) return `<div class="mosaic one ${cls}">${items[0] ? thumb(items[0]) : ''}</div>`;
  return `<div class="mosaic ${cls}">${pick.map(t => thumb(t)).join('')}</div>`;
}
function rowHtml(t, i, kind, anim) {

  return `<div class="row${on ? ' on' : ''}${sl ? ' sl' : ''}${anim ? ' in' : ''}" data-id="${t.id}" data-i="${i}" style="--i:${Math.min(i, 22)}" tabindex="0">
    <div class="ix"><span class="n">${i + 1}</span>${kind === 'lib' ? `<button class="ck" data-act="sel" aria-label="Seç" aria-pressed="${sl}"><svg class="ic"><use href="#i-check"/></svg></button>` : `<svg class="ic pi"><use href="#i-play"/></svg>`}<span class="eq"><i></i><i></i><i></i></span></div>

    <div class="al">${esc(t.album)}</div>
    <div class="tm">${fmt(t.duration)}</div>
    ${kind === 'lib' ? `<button class="rm" data-act="rm" aria-label="Kütüphaneden kaldır" title="Kaldır"><svg class="ic"><use href="#i-trash"/></svg></button>` : ''}
  </div>`;
}
const thead = kind => `<div class="thead"><span>#</span><span>Başlık</span><span class="al">Albüm</span><span>Süre</span>${kind === 'lib' ? '<span></span>' : ''}</div>`;

      inp.focus();

    }, 30);
  } else if (phase === 'wait') {
    body.innerHTML = `<h3>Bağlanılıyor…</h3><p class="d">Diğer cihaz bekleniyor.</p><div class="dots"><i></i><i></i><i></i></div>`;
  } else if (phase === 'merge-wait') {
    body.innerHTML = `<h3>Bulundu!</h3><p class="d">Cihazlar eşleniyor…</p><div class="mrg"><div class="cs l"></div><div class="cs r"></div></div>`;
  } else if (phase === 'merge') {
    body.innerHTML = `<h3>Bağlandı</h3><div class="mrg hit"><div class="cs l"></div><div class="cs r"></div></div>`;
  } else if (phase === 'sending' || phase === 'receiving') {
    body.innerHTML = `<h3>${phase === 'sending' ? 'Gönderiliyor' : 'Alınıyor'}</h3><p class="d" id="shovLbl">Hazırlanıyor…</p><div class="prog"><i id="shovBar"></i></div>`;
  } else if (phase === 'done') {
    body.innerHTML = `<div class="ok"><svg class="ic" style="width:28px;height:28px"><use href="#i-check"/></svg></div><h3>Hazır</h3><p class="d">${esc(data.msg || 'Çalma listesi senkron.')}</p><button class="btn main" data-act="shareClose">Kapat</button>`;
    if (shDoneTimer) clearTimeout(shDoneTimer);
    shDoneTimer = setTimeout(() => { shDoneTimer = null; shareClose(); }, 1900);
  } else if (phase === 'error') {
    body.innerHTML = `<h3>Olmadı</h3><p class="d">${esc(data.msg || 'Bir şeyler ters gitti.')}</p><button class="btn" data-act="shareClose">Kapat</button>`;
  }
}
function shProgress(frac, label) {
  const bar = $('#shovBar'); if (bar) bar.style.setProperty('--w', Math.round(frac * 100) + '%');
  const lbl = $('#shovLbl'); if (lbl && label) lbl.textContent = label;
}
const SH_CHUNK = 16384, SH_THRESH = 1 << 19;
async function shSendBlob(dc, blob) {
  const buf = await blob.arrayBuffer();
  let off = 0;
  while (off < buf.byteLength) {
    if (shAborted) return;
    if (dc.bufferedAmount > SH_THRESH) await new Promise(r => { dc.onbufferedamountlow = () => { dc.onbufferedamountlow = null; r(); }; });
    dc.send(buf.slice(off, off + SH_CHUNK)); off += SH_CHUNK;
  }
}
async function shSendPlaylist(dc, L) {
  const items = L.trackIds.map(id => S.tracks.get(id)).filter(Boolean);
  shovPhase('sending'); shProgress(0, `0/${items.length} şarkı`);
  dc.send(JSON.stringify({ t: 'meta', name: L.name, mode: L.mode, tracks: items.map(t => ({ title: t.title, artist: t.artist, album: t.album, duration: t.duration })) }));
  for (let i = 0; i < items.length; i++) {
    if (shAborted) return;
    const t = items[i];
    const file = await getFile(t.id);
    const cover = covers.get(t.id);
    if (!file) continue;
    dc.send(JSON.stringify({ t: 'file', i, size: file.size, mime: file.type || 'audio/mpeg', cover: cover ? { size: cover.size, mime: cover.type || 'image/jpeg' } : null }));
    await shSendBlob(dc, file);
    if (cover) await shSendBlob(dc, cover);
    shProgress((i + 1) / items.length, `${i + 1}/${items.length} şarkı`);
  }
  if (shAborted) return;
  dc.send(JSON.stringify({ t: 'done' }));
  shovPhase('done', { msg: 'Çalma listesi arkadaşına ulaştı.' });
}
function shWireReceiver(dc) {
  let listMeta = null, tracks = [], ids = [], pend = null, buf = [], got = 0;
  shovPhase('receiving'); shProgress(0, 'Bekleniyor…');
  dc.onmessage = async e => {
    if (shAborted) return;
    if (typeof e.data === 'string') {
      let msg; try { msg = JSON.parse(e.data); } catch (e2) { return; }
      if (msg.t === 'meta') {
        listMeta = msg; tracks = msg.tracks.map(m => Object.assign({}, m, { newId: uid() }));
        shProgress(0, `0/${tracks.length} şarkı`);
      } else if (msg.t === 'file') {
        pend = { i: msg.i, mime: msg.mime, stage: 'file', size: msg.size, cover: msg.cover };
        buf = []; got = 0;
      } else if (msg.t === 'done') {
        const L = { id: uid(), name: (listMeta && listMeta.name) || 'ShufflerShare', trackIds: ids, mode: (listMeta && listMeta.mode) || 'balanced', created: Date.now() };
        S.lists.unshift(L); saveList(L);
        render();
        shovPhase('done', { msg: `${ids.length} şarkı eklendi. Dosya yüklemeden dinleyebilirsin.` });
      }
      return;
    }
    if (!pend) return;
    buf.push(e.data); got += e.data.byteLength;
    if (got < pend.size) return;
    const blob = new Blob(buf, { type: pend.stage === 'cover' ? (pend.cover && pend.cover.mime || 'image/jpeg') : pend.mime });
    if (pend.stage === 'file') {
      const m = tracks[pend.i], id = m.newId;
      const track = { id, sig: 'share:' + id, title: m.title || '', artist: m.artist || '', album: m.album || '', duration: m.duration || 0, size: blob.size, added: Date.now(), plays: 0, last: 0 };
      S.tracks.set(id, track); fileMem.set(id, blob);
      keep(DB.put('files', { id, blob })); saveTrack(track);
      ids.push(id);
      if (pend.cover) { pend = { i: pend.i, stage: 'cover', size: pend.cover.size, cover: pend.cover }; buf = []; got = 0; }
      else { pend = null; shProgress(ids.length / tracks.length, `${ids.length}/${tracks.length} şarkı`); }
    } else {
      const m = tracks[pend.i]; covers.set(m.newId, blob); keep(DB.put('covers', { id: m.newId, blob }));
      pend = null; shProgress(ids.length / tracks.length, `${ids.length}/${tracks.length} şarkı`);
    }
  };
}
function shWireChannel(dc, role, L) {
  dc.binaryType = 'arraybuffer';
  if (role === 'host') dc.bufferedAmountLowThreshold = SH_THRESH;
  dc.onopen = () => {
    if (shAborted) return;
    shovPhase('merge');
    setTimeout(() => { if (shAborted) return; if (role === 'host') shSendPlaylist(dc, L); }, 1050);
  };
  if (role === 'guest') shWireReceiver(dc);
}
async function startHostShare(L) {
  shAborted = false;
  const code = genCode();
  shovPhase('host-code', { code });
  const cap = await roomCap();
  if (!cap) { shovPhase('error', { msg: 'ShufflerShare şu an bu cihazda kullanılamıyor.' }); return; }
  let room; try { room = await cap.join('share-' + code); } catch (e) { shovPhase('error', { msg: 'Oda açılamadı, tekrar dene.' }); return; }
  try { room.presence({ role: 'host', phase: 'waiting' }); } catch (e) {}
  let started = false;
  const offPeers = room.onPeers(async peers => {
    if (shAborted) return;
    if (started) {
      const ans = peers.find(p => p.phase === 'answer' && p.sdp);
      if (ans && shPc && shPc.signalingState === 'have-local-offer') { started = 'done'; try { await shPc.setRemoteDescription({ type: 'answer', sdp: ans.sdp }); } catch (e) {} }
      return;
    }
    const guest = peers.find(p => p.role === 'guest');
    if (!guest) return;
    started = true;
    shovPhase('merge-wait');
    shPc = new RTCPeerConnection(ICE);
    const dc = shPc.createDataChannel('shuffler', { ordered: true });
    shWireChannel(dc, 'host', L);
    try {
      const offer = await shPc.createOffer(); await shPc.setLocalDescription(offer);
      await waitIce(shPc);
      room.presence({ role: 'host', phase: 'offer', sdp: shPc.localDescription.sdp });
    } catch (e) { shovPhase('error', { msg: 'Bağlantı kurulamadı.' }); }
  });
  shCleanup = () => { try { offPeers && offPeers(); } catch (e) {} try { room.leave(); } catch (e) {} };
}
async function startGuestShare(code) {
  shAborted = false;
  shovPhase('wait');
  const cap = await roomCap();
  if (!cap) { shovPhase('error', { msg: 'ShufflerShare şu an bu cihazda kullanılamıyor.' }); return; }
  let room; try { room = await cap.join('share-' + code); } catch (e) { shovPhase('error', { msg: 'Kod geçersiz ya da oda bulunamadı.' }); return; }
  try { room.presence({ role: 'guest', phase: 'waiting' }); } catch (e) {}
  let answered = false;
  const offPeers = room.onPeers(async peers => {
    if (shAborted || answered) return;
    const host = peers.find(p => p.role === 'host' && p.phase === 'offer' && p.sdp);
    if (!host) return;
    answered = true;
    shovPhase('merge-wait');
    shPc = new RTCPeerConnection(ICE);
    shPc.ondatachannel = ev => shWireChannel(ev.channel, 'guest', null);
    try {
      await shPc.setRemoteDescription({ type: 'offer', sdp: host.sdp });
      const answer = await shPc.createAnswer(); await shPc.setLocalDescription(answer);
      await waitIce(shPc);
      room.presence({ role: 'guest', phase: 'answer', sdp: shPc.localDescription.sdp });
    } catch (e) { shovPhase('error', { msg: 'Bağlantı kurulamadı.' }); }
  });
  shCleanup = () => { try { offPeers && offPeers(); } catch (e) {} try { room.leave(); } catch (e) {} };
}

/* ---------- olaylar ---------- */
function act(a, el) {
  switch (a) {
    case 'nav': go(el.dataset.to); break;
    case 'open': go('playlist', el.dataset.id); break;
    case 'mode': setMode(el.dataset.m); break;
    case 'shuffle': case 'selShuffle': createShuffle(); break;
    case 'pick': $('#fileIn').click(); break;
    case 'pickdir': $('#dirIn').click(); break;
    case 'play': { const L = list(el.dataset.id); if (L && L.trackIds.length) playQueue(L.trackIds, 0, L.id); break; }
    case 'reshuffle': reshuffleList(el.dataset.id); break;
    case 'rename': startRename(); break;
    case 'delplist': confirmTwice(el, () => delList(el.dataset.id), 'Listeyi silmek için bir kez daha bas.'); break;
    case 'sel': toggleSel(el.closest('.row').dataset.id); break;
    case 'rm': confirmTwice(el, () => removeTracks([el.closest('.row').dataset.id]), 'Kaldırmak için bir kez daha bas.'); break;
    case 'selClear': clearSel(); break;
    case 'selRm': confirmTwice(el, () => removeTracks([...S.selected]), 'Seçilenleri kaldırmak için bir kez daha bas.'); break;
    case 'npOpen': npOpen(true); break;
    case 'npClose': npOpen(false); break;
    case 'toggle': toggle(); break;
    case 'next': next(false); break;
    case 'prev': prev(); break;
    case 'repeat': cycleRepeat(); break;
    case 'qjump': jump(+el.dataset.q); break;
    case 'qshuffle': reshuffleUpcoming(); break;
    case 'share': { const L = list(el.dataset.id); if (L && L.trackIds.length) { shareOpen(); startHostShare(L); } break; }
    case 'receive': shareOpen(); shovPhase('guest-enter'); break;
    case 'shareClose': shareClose(); break;
    case 'shareJoin': {
      const v = $('#shovCode'); const code = (v && v.value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      if (code.length < 4) { toast('Kodu eksiksiz gir.'); break; }
      startGuestShare(code); break;
    }
  }
}
function rowPlay(row) {
  const host = row.parentElement, ids = $$('.row', host).map(r => r.dataset.id), i = ids.indexOf(row.dataset.id);
  const lid = S.route.name === 'playlist' ? S.route.id : null;
  if (lid && curId() === row.dataset.id && S.srcList === lid) { toggle(); return; }
  playQueue(ids, i, lid);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) { act(b.dataset.act, b); return; }
  const row = e.target.closest('.row[data-id]'); if (row) rowPlay(row);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('input,textarea,[contenteditable=true]')) {
    if (t.id === 'plname') { if (e.key === 'Enter') { e.preventDefault(); commitRename(t, true); } else if (e.key === 'Escape') commitRename(t, false); }
    return;
  }
  if (e.key === 'Enter' && t.classList && t.classList.contains('row')) { rowPlay(t); return; }
  if (e.key === 'Escape') { if ($('#shov').classList.contains('open')) { shareClose(); return; } npOpen(false); return; }
  if (e.code === 'Space' && !(t.closest && t.closest('button,.row'))) { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight' && e.shiftKey) next(false);
  else if (e.key === 'ArrowLeft' && e.shiftKey) prev();
  else if (e.key === 'ArrowRight' && curTrack()) aud.currentTime += 5;
  else if (e.key === 'ArrowLeft' && curTrack()) aud.currentTime -= 5;
});
document.addEventListener('focusout', e => { if (e.target.id === 'plname' && e.target.isContentEditable) commitRename(e.target, true); });
document.addEventListener('pointermove', e => {
  const g = e.target.closest && e.target.closest('.glass'); if (!g) return;
  const b = g.getBoundingClientRect(); g.style.setProperty('--mx', (e.clientX - b.left) + 'px'); g.style.setProperty('--my', (e.clientY - b.top) + 'px');
}, { passive: true });
$('#q').addEventListener('input', e => {
  S.query = e.target.value;
  if (S.route.name !== 'library') { go('library'); return; }
  const rows = $('#libRows'); if (rows) { rows.innerHTML = libRows(false); $('#libCount').textContent = libCount(); }
});
$('#fileIn').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; addFiles(fs); });
$('#dirIn').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; addFiles(fs); });

let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
window.addEventListener('dragenter', e => { if (hasFiles(e)) { e.preventDefault(); dragDepth++; $('#drop').classList.add('on'); } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } });
window.addEventListener('drop', async e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
  const ents = [...(e.dataTransfer.items || [])].map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  const direct = [...e.dataTransfer.files];
  if (!ents.length) return addFiles(direct);
  const out = []; for (const en of ents) await walkEntry(en, out);
  addFiles(out.length ? out : direct);
});

/* ---------- başlangıç ---------- */
(async function init() {
  let v = 80; try { const s = localStorage.getItem('shuffler.vol'); if (s != null) v = Math.max(0, Math.min(100, +s || 0)); } catch (e) {}
  vol.value = v; vol.style.setProperty('--p', v + '%'); aud.volume = v / 100;
  await DB.init();
  try {
    const [tr, cv, ls] = await Promise.all([DB.all('tracks'), DB.all('covers'), DB.all('lists')]);
    for (const t of tr) S.tracks.set(t.id, t);
    for (const c of cv) covers.set(c.id, c.blob);
    S.lists = ls.sort((a, b) => b.created - a.created);
    for (const L of S.lists) L.trackIds = L.trackIds.filter(id => S.tracks.has(id));
  } catch (e) {}
  render(); syncRepeat(); syncPlayState();
})();
})();
</script>
